<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>춘천신협 금융창구 시뮬레이터</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="branch-name">춘천신협 <span>근화지점</span></div>
      <div class="hud-info">
        <div>영업일<strong id="day">1일차</strong></div>
        <div>시각<strong id="clock">09:00</strong></div>
        <div>실적<strong id="sales">0원</strong></div>
        <div>고객 만족도<strong id="satisfaction">100%</strong></div>
      </div>
    </div>

    <div id="crosshair">+</div>

    <div id="help">
      <span>W A S D</span> 이동
      <span>마우스</span> 시점 조작
      <span>E</span> 상호작용
      <span>SHIFT</span> 달리기
    </div>

    <div id="interaction-hint">화면을 클릭해 시점 조작을 시작하세요.</div>

    <div id="dialog" class="panel hidden">
      <div class="panel-top">
        <div>
          <small>고객 상담</small>
          <h2 id="customer-name">고객 이름</h2>
        </div>
        <button id="close-dialog" class="close-button">✕</button>
      </div>
      <div id="customer-profile"></div>
      <div id="customer-message"></div>
      <div id="answer-list"></div>
      <div id="dialog-feedback"></div>
    </div>

    <div id="computer" class="panel hidden">
      <div class="panel-top">
        <div>
          <small>CHUNCHEON CREDIT UNION</small>
          <h2>금융업무 전산 시스템</h2>
        </div>
        <button id="close-computer" class="close-button">✕</button>
      </div>
      <div class="computer-tabs">
        <button data-tab="deposit" class="active">수신 업무</button>
        <button data-tab="loan">여신 업무</button>
        <button data-tab="insurance">공제 업무</button>
        <button data-tab="member">조합원 업무</button>
      </div>
      <div id="computer-content"></div>
    </div>

    <div id="toast"></div>

    <div id="start-screen">
      <div class="start-card">
        <div class="start-logo">CU</div>
        <h1>춘천신협 금융창구 시뮬레이터</h1>
        <p>근화지점의 금융 업무를 직접 경험해 보세요.</p>
        <div class="start-guide">
          <p>WASD : 이동</p>
          <p>마우스 : 시점 조작</p>
          <p>E : 고객 상담 및 업무 시작</p>
          <p>SHIFT : 달리기</p>
        </div>
        <button id="start-button">영업 시작하기</button>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
