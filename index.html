
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>춘천신협 3D 창구 시뮬레이터</title>

  <!-- 디자인 파일 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">

    <!-- 상단 정보 -->
    <div id="hud">
      <div class="brand">
        <strong>CHUNCHEON CREDIT UNION</strong>
        <span>근화지점 · 금융창구 시뮬레이터</span>
      </div>

      <div class="hud-stats">
        <span>영업일 <b id="day">1</b>일차</span>
        <span>시각 <b id="clock">09:00</b></span>
        <span>실적 <b id="sales">0</b>만원</span>
        <span>만족도 <b id="satisfaction">80</b></span>
      </div>
    </div>

    <!-- 화면 중앙 조준점 -->
    <div id="crosshair"></div>

    <!-- 시작 안내 -->
    <div id="hint">
      화면을 클릭해 마우스를 잠그고 이동하세요
    </div>

    <!-- 조작 방법 -->
    <div id="help">
      <b>조작 방법</b>
      <span>W A S D : 이동</span>
      <span>마우스 : 시점 회전</span>
      <span>Shift : 달리기</span>
      <span>E : 사물·고객 상호작용</span>
      <span>ESC : 마우스 해제</span>
    </div>

    <!-- 오늘의 업무 -->
    <div id="objective">
      <small>오늘의 업무</small>
      <strong id="objectiveText">
        영업점에 출근했습니다. 고객을 맞이하세요.
      </strong>
    </div>

    <!-- 고객 상담창 -->
    <div id="interaction" class="hidden">
      <div class="interaction-card">

        <div class="card-top">
          <span id="interactionTag">고객 상담</span>
          <button id="closeInteraction">×</button>
        </div>

        <h2 id="interactionTitle">고객</h2>

        <p id="interactionText"></p>

        <div id="interactionChoices"></div>

        <div id="interactionFooter"></div>

      </div>
    </div>

    <!-- 전산 업무창 -->
    <div id="computer" class="hidden">
      <div class="computer-window">

        <div class="computer-head">
          <div>
            <b>CU BANKING SYSTEM</b>
            <small>춘천신협 내부 업무 연습용 전산</small>
          </div>

          <button id="closeComputer">
            전산 종료 ×
          </button>
        </div>

        <nav class="tabs">
          <button class="tab active" data-tab="deposit">예금</button>
          <button class="tab" data-tab="loan">대출</button>
          <button class="tab" data-tab="mutual">공제</button>
          <button class="tab" data-tab="member">조합원</button>
        </nav>

        <div id="computerContent"></div>

      </div>
    </div>

    <!-- 알림 -->
    <div id="toast"></div>

    <!-- 하단 안내 -->
    <div id="bottomPrompt">
      주변을 둘러보세요. 창구와 전산 책상에서 E 키를 누를 수 있습니다.
    </div>

  </div>

  <!-- 3D 게임 실행 파일 -->
  <script type="module" src="game.js"></script>

</body>
</html>
